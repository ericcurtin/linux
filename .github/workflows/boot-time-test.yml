name: Boot Time Comparison (initramfs vs initerofs)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boot-time-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            qemu_pkg: qemu-system-x86
            qemu_bin: qemu-system-x86_64
            qemu_args: "-M q35 -cpu max -smp 2 -m 2G -nic none"
            kernel_arch: x86
            kernel_target: bzImage
            kernel_image: arch/x86/boot/bzImage
            defconfig: defconfig
            console: ttyS0
            vda: vda
          - runner: ubuntu-24.04-arm
            arch: aarch64
            qemu_pkg: qemu-system-arm
            qemu_bin: qemu-system-aarch64
            qemu_args: "-M virt -cpu cortex-a72 -smp 2 -m 2G -nic none"
            kernel_arch: arm64
            kernel_target: Image
            kernel_image: arch/arm64/boot/Image
            defconfig: defconfig
            console: ttyAMA0
            vda: vda

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc kmod cpio flex bison libelf-dev libssl-dev \
            ${{ matrix.qemu_pkg }} qemu-utils \
            lz4 erofs-utils binutils \
            python3 dwarves zstd \
            libncurses-dev pkg-config rsync \
            e2fsprogs

      - name: Build kernel with initramfs support (LZ4)
        run: |
          make mrproper
          make ARCH=${{ matrix.kernel_arch }} ${{ matrix.defconfig }}

          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_RD_LZ4
          ./scripts/config --enable CONFIG_PRINTK_TIME
          ./scripts/config --enable CONFIG_SERIAL_8250
          ./scripts/config --enable CONFIG_SERIAL_8250_CONSOLE
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_MMIO
          ./scripts/config --enable CONFIG_VIRTIO_CONSOLE
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_VIRTIO_NET
          ./scripts/config --enable CONFIG_HW_RANDOM_VIRTIO
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_PROC_FS
          ./scripts/config --enable CONFIG_SYSFS
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_BLOCK
          ./scripts/config --enable CONFIG_LZ4_DECOMPRESS
          ./scripts/config --enable CONFIG_CGROUPS
          ./scripts/config --enable CONFIG_INOTIFY_USER
          ./scripts/config --enable CONFIG_NET
          ./scripts/config --enable CONFIG_UNIX
          ./scripts/config --enable CONFIG_AUTOFS_FS
          ./scripts/config --enable CONFIG_TMPFS_POSIX_ACL
          ./scripts/config --enable CONFIG_TMPFS_XATTR
          ./scripts/config --enable CONFIG_FHANDLE
          ./scripts/config --disable CONFIG_INITEROFS

          make ARCH=${{ matrix.kernel_arch }} olddefconfig
          make ARCH=${{ matrix.kernel_arch }} -j$(nproc) ${{ matrix.kernel_target }} modules

          # Install modules for dracut
          make ARCH=${{ matrix.kernel_arch }} INSTALL_MOD_PATH=/tmp/kmod modules_install
          KVER=$(make ARCH=${{ matrix.kernel_arch }} kernelrelease)
          echo "KVER=${KVER}" >> "$GITHUB_ENV"
          echo "Kernel version: ${KVER}"

          cp ${{ matrix.kernel_image }} /tmp/vmlinuz-initramfs

      - name: Build kernel with initerofs support (LZ4)
        run: |
          make mrproper
          make ARCH=${{ matrix.kernel_arch }} ${{ matrix.defconfig }}

          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_RD_LZ4
          ./scripts/config --enable CONFIG_PRINTK_TIME
          ./scripts/config --enable CONFIG_SERIAL_8250
          ./scripts/config --enable CONFIG_SERIAL_8250_CONSOLE
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_MMIO
          ./scripts/config --enable CONFIG_VIRTIO_CONSOLE
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_VIRTIO_NET
          ./scripts/config --enable CONFIG_HW_RANDOM_VIRTIO
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_PROC_FS
          ./scripts/config --enable CONFIG_SYSFS
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_BLOCK
          ./scripts/config --enable CONFIG_EROFS_FS
          ./scripts/config --enable CONFIG_EROFS_FS_ZIP
          ./scripts/config --enable CONFIG_EROFS_FS_BACKED_BY_FILE
          ./scripts/config --enable CONFIG_LZ4_DECOMPRESS
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_INITEROFS
          ./scripts/config --enable CONFIG_CGROUPS
          ./scripts/config --enable CONFIG_INOTIFY_USER
          ./scripts/config --enable CONFIG_NET
          ./scripts/config --enable CONFIG_UNIX
          ./scripts/config --enable CONFIG_AUTOFS_FS
          ./scripts/config --enable CONFIG_TMPFS_POSIX_ACL
          ./scripts/config --enable CONFIG_TMPFS_XATTR
          ./scripts/config --enable CONFIG_FHANDLE

          make ARCH=${{ matrix.kernel_arch }} olddefconfig
          # No modules_install needed: dracut uses modules from the
          # initramfs kernel build (same KVER, identical module set).
          make ARCH=${{ matrix.kernel_arch }} -j$(nproc) ${{ matrix.kernel_target }}

          cp ${{ matrix.kernel_image }} /tmp/vmlinuz-initerofs

      - name: Build Fedora 43 ext4 root disk with systemd
        run: |
          ROOTFS=/tmp/ext4root
          EXT4=/tmp/rootdisk.img

          # Build a minimal Fedora 43 rootfs with systemd in a container.
          # This is the final root filesystem that both initramfs and
          # initerofs will switch_root into after early boot, making the
          # comparison fair.
          docker run --name rootfs-builder fedora:43 bash -c '
            dnf install -y --setopt=install_weak_deps=False \
              systemd bash coreutils util-linux kmod procps-ng

            # Create a systemd service that prints the boot time marker
            # (measured from kernel start via /proc/uptime) and powers off.
            cat > /etc/systemd/system/boot-time-marker.service << "SVCEOF"
          [Unit]
          Description=Print boot time marker and power off
          After=sysinit.target
          Before=shutdown.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c "read -r uptime _ < /proc/uptime; echo BOOT_TIME_MARKER: $${uptime} seconds"
          ExecStartPost=/bin/bash -c "sync; echo o > /proc/sysrq-trigger"
          StandardOutput=journal+console

          [Install]
          WantedBy=default.target
          SVCEOF
            systemctl enable boot-time-marker.service

            systemd-machine-id-setup
            systemctl set-default multi-user.target

            # Mask slow or unnecessary services for faster boot
            systemctl mask NetworkManager.service 2>/dev/null || true
            systemctl mask firewalld.service 2>/dev/null || true
            systemctl mask systemd-networkd-wait-online.service 2>/dev/null || true
            systemctl mask auditd.service 2>/dev/null || true
            systemctl mask sssd.service 2>/dev/null || true
            systemctl mask kdump.service 2>/dev/null || true
            systemctl mask mdmonitor.service 2>/dev/null || true

            # Clean up to reduce image size
            dnf clean all
            rm -rf /var/cache/dnf /var/log/* /tmp/*
          '

          # Export the container filesystem to the host
          sudo mkdir -p "$ROOTFS"
          docker export rootfs-builder | sudo tar -C "$ROOTFS" -xf -
          docker rm rootfs-builder

          echo "Rootfs size: $(sudo du -sh $ROOTFS | cut -f1)"

          # Create and format the ext4 image (sized to fit + 64 MiB headroom)
          SIZE_MB=$(( $(sudo du -sm "$ROOTFS" | cut -f1) + 64 ))
          echo "Creating ${SIZE_MB}M ext4 image..."
          dd if=/dev/zero of="$EXT4" bs=1M count=$SIZE_MB status=none
          mkfs.ext4 -q -L rootfs "$EXT4"

          MNTDIR=/tmp/ext4mnt
          mkdir -p "$MNTDIR"
          sudo mount -o loop "$EXT4" "$MNTDIR"
          sudo cp -a "$ROOTFS/." "$MNTDIR/"
          sudo umount "$MNTDIR"

          echo "ext4 root disk: $(ls -lh $EXT4)"

      - name: Generate Fedora 43 initramfs with dracut
        run: |
          KVER="${{ env.KVER }}"
          echo "Generating Fedora 43 dracut initramfs for kernel ${KVER}"

          # Use Fedora 43 container with dracut to generate an initramfs
          # that uses systemd as PID 1, matching real Fedora boot flow.
          docker run --rm --privileged \
            -v /tmp/kmod/lib/modules/${KVER}:/lib/modules/${KVER}:ro \
            -v /tmp:/output \
            -e KVER="${KVER}" \
            fedora:43 bash -c '
              dnf install -y dracut systemd lvm2 cryptsetup bash coreutils \
                util-linux kmod
              dracut --force --no-hostonly \
                --kver "$KVER" \
                --no-early-microcode \
                /output/fedora-initrd.img "$KVER"
              chmod 644 /output/fedora-initrd.img
              echo "Dracut initramfs generated:"
              ls -lh /output/fedora-initrd.img
            '

          echo "Dracut image info:"
          file /tmp/fedora-initrd.img
          ls -lh /tmp/fedora-initrd.img

          # Extract the dracut initramfs to repackage as both cpio+lz4
          # and EROFS+lz4 from the same content.
          ROOTFS=/tmp/initrd-rootfs
          sudo mkdir -p "$ROOTFS"
          cd "$ROOTFS"

          FTYPE=$(file /tmp/fedora-initrd.img)
          echo "Image type: $FTYPE"

          if echo "$FTYPE" | grep -qi "zstandard"; then
            sudo bash -c "zstdcat /tmp/fedora-initrd.img | cpio -idm 2>/dev/null"
          elif echo "$FTYPE" | grep -qi "gzip"; then
            sudo bash -c "zcat /tmp/fedora-initrd.img | cpio -idm 2>/dev/null"
          elif echo "$FTYPE" | grep -qi "xz"; then
            sudo bash -c "xzcat /tmp/fedora-initrd.img | cpio -idm 2>/dev/null"
          elif echo "$FTYPE" | grep -qi "lz4"; then
            sudo bash -c "lz4cat /tmp/fedora-initrd.img | cpio -idm 2>/dev/null"
          else
            sudo bash -c "cpio -idm < /tmp/fedora-initrd.img 2>/dev/null"
          fi

          echo "Extracted initramfs:"
          ls -la "$ROOTFS"
          echo "Size: $(sudo du -sh $ROOTFS | cut -f1)"

          # Verify systemd is present in the initramfs
          echo "Init: $(ls -la $ROOTFS/init 2>/dev/null || echo 'not found')"
          echo "systemd: $(ls -la $ROOTFS/usr/lib/systemd/systemd 2>/dev/null || echo 'not found')"
          echo "sbin/init: $(ls -la $ROOTFS/sbin/init 2>/dev/null || echo 'not found')"

          # -- Build LZ4-compressed initramfs (cpio archive) --
          echo "Building LZ4-compressed initramfs (cpio)..."
          (cd "$ROOTFS" && sudo find . -print0 | sudo cpio --null -o -H newc 2>/dev/null) | \
            lz4 -l -9 > /tmp/initramfs.img.lz4
          echo "initramfs cpio+lz4: $(ls -lh /tmp/initramfs.img.lz4)"

          # -- Prepare EROFS initramfs with overlay wrapper --
          # EROFS is read-only, but dracut scripts need to write files
          # (state files, udev rules, hook scripts) during early boot.
          # Replace /init with a wrapper that layers an overlayfs (tmpfs
          # upper + EROFS lower) before exec'ing the real systemd init.
          sudo rm -f "$ROOTFS/init"
          sudo tee "$ROOTFS/init" > /dev/null << 'INITEOF'
#!/bin/sh
# Overlay wrapper for initerofs: makes the read-only EROFS root writable
# by layering overlayfs on top before handing off to systemd.

mount -t proc proc /proc 2>/dev/null
mount -t tmpfs tmpfs /overlay_work -o mode=0700
mkdir -p /overlay_work/upper /overlay_work/work /overlay_root
mount -t overlay overlay /overlay_root \
  -o lowerdir=/,upperdir=/overlay_work/upper,workdir=/overlay_work/work

# Move existing mounts into the overlay root
mount --move /proc /overlay_root/proc 2>/dev/null
mount --move /overlay_work /overlay_root/overlay_work 2>/dev/null

# Switch to the overlay root and exec systemd
cd /overlay_root
pivot_root . overlay_root
umount -l /overlay_root 2>/dev/null

exec /usr/lib/systemd/systemd "$@"
INITEOF
          sudo chmod 755 "$ROOTFS/init"
          sudo mkdir -p "$ROOTFS/overlay_work" "$ROOTFS/overlay_root"

          # -- Build LZ4-compressed EROFS image for initerofs --
          echo "Building LZ4-compressed EROFS image..."
          sudo mkfs.erofs -zlz4 /tmp/initramfs.erofs "$ROOTFS"
          echo "initerofs EROFS+lz4: $(ls -lh /tmp/initramfs.erofs)"

      - name: Boot with initramfs and measure time
        id: boot_initramfs
        run: |
          echo "=== Booting with initramfs (LZ4 cpio) -> systemd -> switch_root -> ext4 systemd ==="

          BOOT_TIMES=""
          RUNS=5

          for i in $(seq 1 $RUNS); do
            echo "--- initramfs run $i of $RUNS ---"

            timeout 120 ${{ matrix.qemu_bin }} \
              ${{ matrix.qemu_args }} \
              -kernel /tmp/vmlinuz-initramfs \
              -initrd /tmp/initramfs.img.lz4 \
              -drive file=/tmp/rootdisk.img,format=raw,if=virtio \
              -append "console=${{ matrix.console }} root=/dev/${{ matrix.vda }} rootfstype=ext4 rw quiet loglevel=3 printk.time=1 rd.lvm=0 rd.dm=0 rd.md=0 rd.neednet=0 systemd.show_status=no" \
              -nographic \
              -no-reboot 2>&1 | tee /tmp/boot_initramfs_${i}.log || true

            BTIME=$(grep "BOOT_TIME_MARKER:" /tmp/boot_initramfs_${i}.log | \
                    head -1 | sed 's/.*BOOT_TIME_MARKER: \([0-9.]*\).*/\1/')

            if [ -z "$BTIME" ]; then
              echo "ERROR: Failed to extract boot time from run $i"
              cat /tmp/boot_initramfs_${i}.log
              exit 1
            fi

            echo "initramfs run $i boot time: ${BTIME}s"
            BOOT_TIMES="${BOOT_TIMES} ${BTIME}"
          done

          MEDIAN=$(echo "$BOOT_TIMES" | python3 -c "
          import sys, statistics
          times = [float(x) for x in sys.stdin.read().split()]
          print(f'{statistics.median(times):.6f}')
          ")

          echo "initramfs median boot time: ${MEDIAN}s (from runs:${BOOT_TIMES})"
          echo "boot_time=${MEDIAN}" >> "$GITHUB_OUTPUT"

      - name: Boot with initerofs and measure time
        id: boot_initerofs
        run: |
          echo "=== Booting with initerofs (EROFS + LZ4) -> systemd -> switch_root -> ext4 systemd ==="

          BOOT_TIMES=""
          RUNS=5

          for i in $(seq 1 $RUNS); do
            echo "--- initerofs run $i of $RUNS ---"

            timeout 120 ${{ matrix.qemu_bin }} \
              ${{ matrix.qemu_args }} \
              -kernel /tmp/vmlinuz-initerofs \
              -initrd /tmp/initramfs.erofs \
              -drive file=/tmp/rootdisk.img,format=raw,if=virtio \
              -append "console=${{ matrix.console }} root=/dev/${{ matrix.vda }} rootfstype=ext4 rw quiet loglevel=3 printk.time=1 rd.lvm=0 rd.dm=0 rd.md=0 rd.neednet=0 systemd.show_status=no" \
              -nographic \
              -no-reboot 2>&1 | tee /tmp/boot_initerofs_${i}.log || true

            BTIME=$(grep "BOOT_TIME_MARKER:" /tmp/boot_initerofs_${i}.log | \
                    head -1 | sed 's/.*BOOT_TIME_MARKER: \([0-9.]*\).*/\1/')

            if [ -z "$BTIME" ]; then
              echo "ERROR: Failed to extract boot time from run $i"
              cat /tmp/boot_initerofs_${i}.log
              exit 1
            fi

            echo "initerofs run $i boot time: ${BTIME}s"
            BOOT_TIMES="${BOOT_TIMES} ${BTIME}"
          done

          MEDIAN=$(echo "$BOOT_TIMES" | python3 -c "
          import sys, statistics
          times = [float(x) for x in sys.stdin.read().split()]
          print(f'{statistics.median(times):.6f}')
          ")

          echo "initerofs median boot time: ${MEDIAN}s (from runs:${BOOT_TIMES})"
          echo "boot_time=${MEDIAN}" >> "$GITHUB_OUTPUT"

      - name: Compare boot times
        run: |
          INITRAMFS_TIME="${{ steps.boot_initramfs.outputs.boot_time }}"
          INITEROFS_TIME="${{ steps.boot_initerofs.outputs.boot_time }}"

          echo "============================================"
          echo "       Boot Time Comparison Results"
          echo "============================================"
          echo "Architecture:    ${{ matrix.arch }}"
          echo "Boot path:       systemd-in-initramfs -> switch_root -> systemd-on-ext4"
          echo "initramfs time:  ${INITRAMFS_TIME}s"
          echo "initerofs time:  ${INITEROFS_TIME}s"
          echo "============================================"

          python3 << PYEOF
          import sys

          initramfs = float("${INITRAMFS_TIME}")
          initerofs = float("${INITEROFS_TIME}")

          diff = initramfs - initerofs
          if initramfs > 0:
              pct = (diff / initramfs) * 100
          else:
              pct = 0

          print()
          if initerofs < initramfs:
              print(f"PASS: initerofs is {diff:.6f}s ({pct:.2f}%) FASTER than initramfs")
              print(f"  initerofs: {initerofs:.6f}s vs initramfs: {initramfs:.6f}s")
          elif initerofs == initramfs:
              print(f"PASS: initerofs and initramfs boot times are equal ({initerofs:.6f}s)")
          else:
              slower = initerofs - initramfs
              if initramfs > 0:
                  spct = (slower / initramfs) * 100
              else:
                  spct = 0
              print(f"FAIL: initramfs is {slower:.6f}s ({spct:.2f}%) FASTER than initerofs")
              print(f"  initerofs: {initerofs:.6f}s vs initramfs: {initramfs:.6f}s")
              sys.exit(1)
          PYEOF
